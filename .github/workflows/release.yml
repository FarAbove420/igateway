# When a release is published on GitHub, builds the app, runs all tests and
# attaches iGateway.exe-<version>-arm64.zip and its .sha256 to the release.
# The tag has to match the version in build.zsh: v0.6.0 for 0.6.0.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version
        run: |
          version="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' build.zsh)"
          if [[ "${{ github.event.release.tag_name }}" != "v$version" ]]; then
            echo "The tag is ${{ github.event.release.tag_name }}, build.zsh says $version."
            exit 1
          fi

      # The same cache as the build workflow.
      - uses: actions/cache@v6
        with:
          path: |
            deps/downloads
            deps/tools
            deps/out
          key: deps-${{ hashFiles('deps/build-deps.zsh') }}

      - name: Dependencies
        run: ./deps/build-deps.zsh --test-server

      - name: Tests
        run: ./build.zsh && ./tests/run.zsh

      - name: Pack
        run: ./release.zsh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/*.sha256 --clobber
